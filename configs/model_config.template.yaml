# Model and API Configuration for PaperVizAgent

# Default Models (must not be empty — used for all generation calls)
defaults:
  main_model_name: "gemini-3.1-pro-preview"
  image_gen_model_name: "gemini-3.1-flash-image-preview"
  
# API Keys. If you are using all gemini models, you can leave the other keys empty.
api_keys:
  google_api_key: "" # e.g. "xxxxxxxxxxxxx"
  openai_api_key: ""
  anthropic_api_key: ""
  openrouter_api_key: "" # e.g. "sk-or-v1-xxxxx". Set model_name to "openrouter/<model>" to use.
  orcarouter_api_key: "" # e.g. "sk-orca-xxxxx". Set model_name to "orcarouter/<model>" to use.
  api_route_api_key: "" # Or API_ROUTE_API_KEY. Text: main_model_name="api-route/gpt-6.1-sol".
  atlascloud_api_key: "" # Set model_name to "atlas/<model>" to use Atlas Cloud.
  runcrate_api_key: "" # Set model_name to "runcrate/<model>" to use Runcrate, e.g. "runcrate/deepseek-ai/DeepSeek-V4.1-Flash".
  cloudgpu_api_key: "" # Or CLOUDGPU_API_KEY. Set model_name to "cloudgpu/<model>" to use CloudGPU, e.g. "cloudgpu/deepseek-v4-flash".
  local_openai_api_key: "" # Optional for local/<model>. Defaults to "local".
  ollama_api_key: "" # Optional for ollama/<model>. Defaults to "ollama".
  litellm_api_key: "" # Optional for litellm/<provider>/<model> (text and image), e.g. "litellm/vertex_ai/gemini-3-pro-image-preview". Leave empty to use that provider's own env credentials. Needs: pip install "litellm>=1.97.0,<1.106.0".

base_urls:
  api_route_base_url: "https://global.api-route.com/v1" # Or API_ROUTE_BASE_URL.
  atlascloud_base_url: "https://api.atlascloud.ai/v1"
  runcrate_base_url: "https://api.runcrate.ai/v1"
  cloudgpu_base_url: "https://cloudgpu.app/v1" # Or CLOUDGPU_BASE_URL.
  # Text-only OpenAI-compatible servers. Image agents reject local/ and ollama/.
  local_openai_base_url: "" # Required for local/<model>, e.g. "http://127.0.0.1:8000/v1"
  ollama_base_url: "" # Optional override; ollama/<model> defaults to http://localhost:11434/v1
  litellm_base_url: "" # Optional for litellm/ models, e.g. a LiteLLM proxy at "http://localhost:4000".

# API Route is opt-in for text generation via the api-route/ prefix.
# Keep image_gen_model_name and its provider key configured separately.
# Setup: https://www.api-route.com/en/docs/quickstart
